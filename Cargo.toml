[package]
name = "efm32xg-demo"
version = "0.1.0"
edition = "2021"
description = "Demo binary using efm32xg-hal"

[dependencies]
# Local path to the HAL crate
efm32xg-hal = { path = "../efm32xg-hal", features = ["defmt", "qfn48", "efemb", "efemb-timdrv-letim0-hz-32_768"] }

# Embassy for async
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1" }
embassy-sync = { version = "0.7.2" }

# defmt for logging (optional, enabled by feature)
defmt = { version = "1.0", optional = true }
defmt-rtt = { version = "1.0", optional = true }

# Panic handler
panic-probe = { version = "1.0", features = ["print-defmt"] }

# cortex-m runtime
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"

# embedded-hal traits
embedded-hal = { version = "1.0" }
embedded-hal-async = { version = "1.0" }

[features]
default = ["defmt"]
defmt = [
    "dep:defmt", 
    "dep:defmt-rtt", 
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime-us"
]

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = 2
lto = 'fat'